# Full local-dev stack. Hot reload on backend/frontend/ai-service;
# celery-worker needs a manual restart after task code changes. See DOCKER.md.
#
# Ports: frontend 5173, backend 8000, ai-service 8001, mock-bank-oauth 8002,
# mock-bank-sync 8003, postgres 5433, redis 6379, seaweedfs 8333/9333/8888.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml down          # keep data
#   docker compose -f docker-compose.dev.yml down -v       # wipe data too

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-change-me-ai-db-pass}
      MOCK_BANK_DB_PASSWORD: ${MOCK_BANK_DB_PASSWORD:-mock_bank_db_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../nbe-financial-advisor-backend/deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: "server -dir=/data -master.volumeSizeLimitMB=1024 -filer -s3 -s3.port=8333"
    volumes:
      - seaweed_data:/data
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../nbe-financial-advisor-backend
      args:
        BUILD_ENV: development
    # seed_db is DEBUG-guarded and flushes/reseeds its own rows each run, so
    # it's safe on every startup. register_mock_bank_customer needs a real
    # --email and isn't guaranteed mock-bank-sync is ready yet (no
    # depends_on/healthcheck link to it here), so it's opt-in via
    # SEED_MOCK_BANK_CUSTOMER_EMAIL and `|| true` so a failure there can't
    # take down the rest of startup.
    command: >
      sh -c "python manage.py migrate &&
            python manage.py ensure_storage_buckets &&
            python manage.py seed_onboarding_templates &&
            python manage.py seed_db &&
            if [ -n \"$SEED_MOCK_BANK_CUSTOMER_EMAIL\" ]; then python manage.py register_mock_bank_customer --email \"$SEED_MOCK_BANK_CUSTOMER_EMAIL\" || true; fi &&
            python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ../nbe-financial-advisor-backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: 1
      USE_MOCK_AI_SERVICE: "0"
      AI_SERVICE_URL: http://ai-service:8001
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SEAWEED_S3_ENDPOINT: http://seaweedfs:8333
      MOCK_BANK_OAUTH_SERVICE_URL: http://mock-bank-oauth:8002
      MOCK_BANK_OAUTH_REDIRECT_URI: ${MOCK_BANK_OAUTH_REDIRECT_URI:-http://localhost:5173/bank-connect/callback}
      MOCK_BANK_SYNC_SERVICE_URL: http://mock-bank-sync:8003
      # Set to a real email (e.g. in .env, or `SEED_MOCK_BANK_CUSTOMER_EMAIL=you@x.com docker compose ... up`)
      # to also register a mock bank customer with starter transactions on startup. Unset = skipped.
      SEED_MOCK_BANK_CUSTOMER_EMAIL: ${SEED_MOCK_BANK_CUSTOMER_EMAIL:-}
    volumes:
      - ../nbe-financial-advisor-backend:/app
      - /app/.venv
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ../nbe-financial-advisor-backend
      args:
        BUILD_ENV: development
    command: sh -c "celery -A config worker --loglevel=info --concurrency=2"
    env_file:
      - ../nbe-financial-advisor-backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: 1
      USE_MOCK_AI_SERVICE: "0"
      AI_SERVICE_URL: http://ai-service:8001
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SEAWEED_S3_ENDPOINT: http://seaweedfs:8333
      MOCK_BANK_OAUTH_SERVICE_URL: http://mock-bank-oauth:8002
      MOCK_BANK_OAUTH_REDIRECT_URI: ${MOCK_BANK_OAUTH_REDIRECT_URI:-http://localhost:5173/bank-connect/callback}
      MOCK_BANK_SYNC_SERVICE_URL: http://mock-bank-sync:8003
    volumes:
      - ../nbe-financial-advisor-backend:/app
      - /app/.venv
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy

  mock-bank-oauth:
    build:
      context: ../nbe-financial-advisor-backend/mock-bank-oauth
    env_file:
      - ../nbe-financial-advisor-backend/.env
    environment:
      MOCK_BANK_SYNC_SERVICE_URL: http://mock-bank-sync:8003
      FRONTEND_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MOCK_BANK_OAUTH_ENABLE_DEBUG_ENDPOINTS: 1
    ports:
      - "8002:8002"

  mock-bank-sync:
    build:
      context: ../nbe-financial-advisor-backend/mock-bank-sync
    env_file:
      - ../nbe-financial-advisor-backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BACKEND_WEBHOOK_URL: http://backend:8000/webhooks/bank-sync/
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ../nbe-financial-advisor-ai-service
      target: dev
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    env_file:
      - ../nbe-financial-advisor-ai-service/.env
    volumes:
      - ../nbe-financial-advisor-ai-service:/app
      - ai-service-dev-venv:/app/.venv
    ports:
      - "8001:8001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"

networks:
  default:
    name: nbe-dev

volumes:
  pgdata:
  seaweed_data:
  ai-service-dev-venv:
  frontend-node-modules:
