name: PR Quality Gates

on:
  pull_request:

jobs:
  hardcoded-hex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for hardcoded hex colors
        run: scripts/check-no-hardcoded-hex.sh ${{ github.event.pull_request.base.sha }}

  no-dangerous-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for new dangerouslySetInnerHTML usage
        run: scripts/check-no-dangerous-html.sh ${{ github.event.pull_request.base.sha }}

  i18n-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:i18n
