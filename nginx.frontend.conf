server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SEC-006 — security headers (defense-in-depth; the public edge nginx in
  # deploy/nginx.conf sets the same policy for the request path that
  # actually reaches users, but this container's own nginx serves the SPA
  # directly too — e.g. if a future topology fronts it without that edge).
  # At server level (not per-location) so it applies to every response.
  #
  # script-src/style-src need 'unsafe-inline': the SPA build (react-router,
  # ssr:false) emits a first-paint theme-detection <script> (app/root.tsx)
  # and its own hydration bootstrap inline, with no nonce/hash infra to
  # allow them more strictly — verified against the actual build output
  # (build/client/index.html) before adding this, not assumed. 19 components
  # also use inline style={{...}} (React's inline-style prop), which is the
  # same style-src gate.
  #
  # No Strict-Transport-Security here: this config has no TLS termination
  # (`listen 80` only) — HSTS is a no-op without HTTPS and premature to add
  # before TLS is actually configured. Add it once `listen 443 ssl` (with
  # real certificates) is in place, or once external TLS termination
  # (load balancer/CDN) is confirmed.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # SPA: any unmatched path returns index.html so client-side routing works
  location / {
    try_files $uri $uri/ /index.html;
  }
}
